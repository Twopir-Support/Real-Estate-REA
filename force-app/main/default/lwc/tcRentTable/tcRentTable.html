<template>
    <lightning-card title="Rent Table" icon-name="custom:custom25">
        <lightning-button slot="actions" label="Generate from terms" icon-name="utility:magicwand" onclick={handleGenerate}></lightning-button>
        <div class="slds-p-horizontal_medium">
            <template lwc:if={loading}><lightning-spinner alternative-text="Working" size="small"></lightning-spinner></template>
            <template lwc:if={error}><div class="slds-text-color_error">{error}</div></template>
            <template lwc:if={hasWarnings}>
                <div class="review" role="status">
                    <lightning-icon icon-name="utility:warning" size="x-small" alternative-text="Review"></lightning-icon>
                    <div><strong>Rent table review</strong>
                        <ul><template for:each={warnings} for:item="w"><li key={w.key}>{w.text}</li></template></ul>
                    </div>
                </div>
            </template>
            <template lwc:if={hasRows}>
                <lightning-datatable key-field="Id" data={rows} columns={columns} draft-values={draftValues} onsave={handleSave} hide-checkbox-column show-row-number-column="false"></lightning-datatable>
                <div class="foot"><span>Calculation: {methodLabel}</span><span>Total rent <strong>{totalLabel}</strong></span></div>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak slds-p-vertical_small">No rent periods yet. Fill in the term, size and rate, then choose Generate from terms.</p>
            </template>
        </div>
    </lightning-card>
</template>
